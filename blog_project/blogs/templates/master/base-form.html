{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>{{ form_title }}</h1>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form_data|crispy }}
    <button type="submit" class="btn btn-primary">{{ form_submit_text }}</button>
  </form>
  <div class="text-center mt-4">
    <small>{{ auth_switch_text }} <a href="{{ auth_switch_link }}" class="text-primary text-decoration-none">{{ auth_switch_link_text }}</a></small>
  </div>
{% endblock %}
