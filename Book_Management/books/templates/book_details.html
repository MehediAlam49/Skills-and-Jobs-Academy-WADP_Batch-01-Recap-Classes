{% extends 'master/base.html' %}


{% block content %}
    <h1>Book details</h1>
    <div class="card mb-4" style="max-width: 600px; margin: auto;">
        <div class="card-body">
            <h5 class="card-title">{{ book.title }}</h5>
            <h6 class="card-subtitle mb-2 text-muted">By {{ book.author_name }} ({{ book.author_email }})</h6>
            <p class="card-text">{{ book.description }}</p>
            <p class="card-text"><small class="text-muted">Created at: {{ book.created_at|date:"Y-m-d H:i" }}</small></p>
        </div>
{% endblock content %}
