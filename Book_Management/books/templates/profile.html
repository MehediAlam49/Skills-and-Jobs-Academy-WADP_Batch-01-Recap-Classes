{% extends 'master/base.html' %}

{% block content %}
  <h1>My Profile</h1>
  <div class="card mb-4" style="max-width: 600px; margin: auto;">
    <div class="row g-0">
      <div class="col-md-4 d-flex align-items-center justify-content-center">
        <img src="{{ user.profile_image.url }}" alt="Profile Image" class="img-fluid rounded-circle" style="width: 150px; height: 150px; object-fit: cover;">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">{{ user.username }}</h5>
          <h5 class="card-title"><strong>Full Name:</strong> {{ user.full_name }}</h5>
          <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
          <p class="card-text"><strong>Status:</strong> {% if user.is_active %}Active{% else %}Inactive{% endif %}</p>
        </div>
        <a href="{% url 'update_profile' %}" class="btn btn-primary mb-2">Update Profile</a>
        <a href="{% url 'change_password' %}" class="btn btn-success mb-2">Change Password</a>
       
      </div>
    </div>
  </div>
{% endblock %}
